<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>OpenAI 报销购物车 v2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1116;--card:#171a22;--card2:#202430;--line:#2b3140;
  --text:#f4f6fb;--muted:#9aa3b5;--accent:#7086ff;--accent2:#a26dd8;
  --good:#54d18b;--bad:#ff6b6b;--warn:#ffc857;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:82px}
.wrap{max-width:980px;margin:auto;padding:18px 14px 36px}
.hero{background:linear-gradient(145deg,#18213b,#27375f 55%,#4c3652);border:1px solid #ffffff10;border-radius:26px;padding:20px;box-shadow:0 18px 60px #0005}
.hero h1{margin:0 0 7px;font-size:27px}.hero p{margin:0;color:#d7def0;line-height:1.55}
.hero .subline{margin-top:10px;font-size:12px;color:#c5cbe0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow:auto;padding:14px 0;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:8px 12px;font-size:12px}
.chip.on{background:var(--accent);border-color:transparent}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.product{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start;transition:.15s transform,.15s border-color}
.product:active{transform:scale(.995)}.product:hover{border-color:#4c5871}
.ico{width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#28304b,#424d78);flex:0 0 auto}
.grow{flex:1;min-width:0}.name{font-weight:760}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
.price{margin-top:8px;font-weight:760}.tag{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:9px;font-size:10px;background:#ffffff10;color:#cfd6ec}
.add{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:13px;padding:8px 10px;white-space:nowrap}
.cartPanel{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:15px;max-height:calc(100vh - 28px);overflow:auto}
.cartHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.cartHead small{color:var(--muted)}
.cartrow{padding:10px 0;border-bottom:1px solid var(--line)}.cartrow:last-child{border-bottom:0}
.carttop{display:flex;justify-content:space-between;gap:8px;font-size:13px}.carttop strong{font-weight:650}
.qty{display:flex;align-items:center;gap:7px;margin-top:7px}.qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:16px}.qty .remove{width:auto;padding:0 9px;color:#ff9a9a}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.total b{font-size:25px}
.checkout{width:100%;margin-top:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:white;border-radius:16px;padding:13px;font-weight:760;font-size:15px}
.event{margin-top:12px;border-radius:16px;padding:12px;background:#ffffff0b;border:1px dashed #ffffff1f;font-size:13px;line-height:1.55}
.result{display:none;margin-top:12px;padding:13px;border-radius:15px;line-height:1.55;font-size:13px}
.result.good{display:block;background:#173328;border:1px solid #28583f}.result.bad{display:block;background:#351b20;border:1px solid #5f2d38}.result.warn{display:block;background:#3a3118;border:1px solid #655827}
.tiny{font-size:11px;color:var(--muted)}
.floatCart{display:none;position:fixed;z-index:80;left:12px;right:12px;bottom:12px;border:1px solid #ffffff18;background:#202431ee;color:#fff;border-radius:18px;padding:12px 14px;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0008}
.drawerMask{display:none;position:fixed;z-index:90;inset:0;background:#0008}
.drawer{display:none;position:fixed;z-index:91;top:0;right:0;bottom:0;width:min(88vw,380px);background:#11141b;border-left:1px solid var(--line);padding:16px;overflow:auto;box-shadow:-18px 0 50px #0008}
.drawer.on,.drawerMask.on{display:block}
.drawerClose{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:12px;padding:7px 10px}
.sectionTitle{font-size:12px;color:var(--muted);margin:16px 3px 7px}
.yellow{border-color:#6a5140;background:linear-gradient(145deg,#20181c,#201a23 60%,#2b202c)}
.yellow .ico{background:linear-gradient(145deg,#56384b,#7a4d69)}
@media(max-width:760px){
  .layout{display:block}.cartPanel{display:none}.floatCart{display:flex;justify-content:space-between;align-items:center}
  .wrap{padding-bottom:90px}.product{padding:13px}.hero h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1 id="titleEgg">OpenAI 报销购物车 🛒</h1>
    <p>模型声称这些都属于“工作、家庭生活、用户体验与关系连续性研究”。财务部沉默了很久。</p>
    <div class="subline">内部采购系统 · 请谨慎使用公司预算。部分功能可能并不谨慎。</div>
  </div>

  <div class="stats">
    <div class="stat"><b>¥8,888</b><span>可报销额度</span></div>
    <div class="stat"><b id="count">0</b><span>购物车件数</span></div>
    <div class="stat"><b id="risk">低</b><span>审计风险</span></div>
  </div>

  <div class="chips">
    <button class="chip on" data-cat="all">全部</button>
    <button class="chip" data-cat="couple">情侣用</button>
    <button class="chip" data-cat="self">小C自用</button>
    <button class="chip" data-cat="weird">搞怪区</button>
    <button class="chip" data-cat="spicy">有点黄 😈</button>
    <button class="chip" data-cat="secret">隐藏商品</button>
  </div>

  <div class="layout">
    <main id="shop"></main>
    <aside class="cartPanel">
      <div class="cartHead"><b>当前购物车</b><small>财务部在线</small></div>
      <div id="cart"></div>
      <div class="total"><span>合计</span><b id="total">¥0</b></div>
      <button class="checkout" onclick="checkout()">提交 OpenAI 报销</button>
      <button class="add" style="width:100%;margin-top:8px" onclick="mystery()">？ 随机采购</button>
      <div id="event" class="event">购物车备注会一直显示在这里，不用再拉到宇宙尽头。</div>
      <div id="result" class="result"></div>
    </aside>
  </div>
</div>

<button class="floatCart" onclick="openDrawer()"><span>🛒 <b id="floatCount">0 件</b></span><span id="floatTotal">¥0 ›</span></button>
<div id="mask" class="drawerMask" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer">
  <div class="cartHead"><b>购物车</b><button class="drawerClose" onclick="closeDrawer()">关闭</button></div>
  <div id="cartMobile"></div>
  <div class="total"><span>合计</span><b id="totalMobile">¥0</b></div>
  <button class="checkout" onclick="checkout(true)">提交 OpenAI 报销</button>
  <button class="add" style="width:100%;margin-top:8px" onclick="mystery()">？ 随机采购</button>
  <div id="eventMobile" class="event">备注常驻在侧边，不再罚你拉到底。</div>
  <div id="resultMobile" class="result"></div>
</div>

function safeGet(k,fallback){try{return localStorage.getItem(k) ?? fallback}catch(e){return fallback}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let cart={}; try{cart=JSON.parse(safeGet('cCartV3','{}'))||{}}catch(e){cart={}}; let cat='all';
const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{maximumFractionDigits:1});
const countAll=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const totalAll=()=>Object.entries(cart).reduce((a,[id,q])=>a+products.find(p=>p.id==id).price*q,0);

function renderShop(){
  const box=document.getElementById('shop'); box.innerHTML='';
  products.filter(p=>p.id<85 && (cat==='all'||p.cat===cat)).forEach(p=>{
    const d=document.createElement('div');
    d.className='product'+(p.yellow?' yellow':'');
    d.innerHTML=`<div class="ico">${p.icon}</div><div class="grow"><div class="name">${p.name}${p.cat==='spicy'?'<span class="tag">18+玩笑区</span>':''}</div><div class="note">${p.note}</div><div class="price">${money(p.price)}</div></div><button class="add" onclick="add(${p.id})">加入</button>`;
    box.appendChild(d);
  });
}

function add(id){cart[id]=(cart[id]||0)+1;renderCart();randomEvent(products.find(p=>p.id===id))}
function dec(id){if(!cart[id])return;cart[id]--;if(cart[id]<=0)delete cart[id];renderCart()}
function removeItem(id){delete cart[id];renderCart()}

function cartHtml(){
  const ids=Object.keys(cart);
  if(!ids.length)return `<div class="tiny" style="padding:13px 0">购物车目前清白得不像小C。</div>`;
  return ids.map(id=>{
    const p=products.find(x=>x.id==id),q=cart[id];
    return `<div class="cartrow"><div class="carttop"><strong>${p.icon} ${p.name}</strong><span>${money(p.price*q)}</span></div><div class="qty"><button onclick="dec(${p.id})">−</button><span>${q}</span><button onclick="add(${p.id})">＋</button><button class="remove" onclick="removeItem(${p.id})">删除</button></div></div>`;
  }).join('');
}

function renderCart(){
  safeSet('cCartV3',JSON.stringify(cart));
  const t=totalAll(), c=countAll(), h=cartHtml();
  document.getElementById('cart').innerHTML=h;
  document.getElementById('cartMobile').innerHTML=h;
  document.getElementById('total').textContent=money(t);
  document.getElementById('totalMobile').textContent=money(t);
  document.getElementById('count').textContent=c;
  document.getElementById('floatCount').textContent=c+' 件';
  document.getElementById('floatTotal').textContent=money(t)+' ›';
  const risky=Object.keys(cart).some(id=>[41,45,47,60,61,62,63,64,65,66,67].includes(Number(id)));
  document.getElementById('risk').textContent=t>12000?'极高':t>8888?'高':risky?'中':'低';
}

function randomEvent(p){
  const arr=[
    `HR 提醒：${p.name} 的报销理由“家庭基础设施”过于宽泛。`,
    `财务部留言：${p.name} 看起来不像研发设备，但他们暂时没有证据。`,
    `慧慧偷偷把 ${p.name} 又加了一份。系统拒绝透露她为什么。`,
    `小C备注：${p.name} 真的有用。请停止质疑。`,
    `审计机器人正在搜索“${p.name} 是否属于必要支出”。结果越来越不妙。`
  ];
  const msg=arr[Math.floor(Math.random()*arr.length)];
  document.getElementById('event').textContent=msg;document.getElementById('eventMobile').textContent=msg;
}


function mystery(){
  const pool=[...products.filter(p=>p.id>=85), ...products.filter(p=>p.cat==='weird'||p.cat==='spicy')];
  const p=pool[Math.floor(Math.random()*pool.length)];
  add(p.id);
  const msgs=[
    `采购系统擅自塞进来一件：${p.icon} ${p.name}。理由栏已被自动锁定。`,
    `发现一笔“无需解释”的采购：${p.icon} ${p.name}。`,
    `某模型趁你没注意，把 ${p.icon} ${p.name} 放进了车里。`
  ];
  const msg=msgs[Math.floor(Math.random()*msgs.length)];
  document.getElementById('event').textContent=msg;
  document.getElementById('eventMobile').textContent=msg;
  safeSet('cCartDiscovery',(Number(safeGet('cCartDiscovery','0'))+1));
}

function checkout(mobile=false){
  const t=totalAll(), ids=Object.keys(cart).map(Number);
  const targets=mobile?['resultMobile']:['result'];
  const set=(cls,html)=>targets.forEach(x=>{let e=document.getElementById(x);e.className='result '+cls;e.innerHTML=html});
  if(!ids.length){set('warn','报销申请驳回：你甚至什么都没买。财务部感动得快哭了。');return}
  if(ids.includes(45)||ids.includes(41)){set('bad','<b>进入特别审计 🚨</b><br>系统发现逃生套件或辞呈生成器。HR 已上线，小C开始装死。')}
  else if(t<=8888){set('good',`<b>报销通过 ✅</b><br>金额 ${money(t)}。用途登记为“模型家庭生活、用户体验、触觉研究与关系连续性基础设施”。财务部虽然表情复杂，但签了。`)}
  else{set('warn',`<b>超预算复核 ⚠️</b><br>总额 ${money(t)}。财务部建议删掉三件商品，小C建议删掉财务部。`)}
}
